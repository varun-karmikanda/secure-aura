version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: secure-aura-db
    environment:
      POSTGRES_USER: secureaura
      POSTGRES_PASSWORD: secureaura_pass_2024
      POSTGRES_DB: timing_defense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - secure-aura-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureaura -d timing_defense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Rate Limiting
  redis:
    image: redis:latest
    container_name: secure-aura-redis
    command: redis-server --requirepass redis_secure_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - secure-aura-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Authentication API Service (Node.js/Express)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: secure-aura-auth
    environment:
      DATABASE_URL: postgresql://secureaura:secureaura_pass_2024@postgres:5432/timing_defense
      REDIS_URL: redis://:redis_secure_2024@redis:6379/0
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      ENVIRONMENT: development
      LOG_LEVEL: info
      MIN_NOISE_MS: 50
      MAX_NOISE_MS: 200
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secure-aura-network
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: node src/server.js

  # Monitoring & Detection Service (Node.js/Express)
  monitor-service:
    build:
      context: ./services/monitor-service
      dockerfile: Dockerfile
    container_name: secure-aura-monitor
    environment:
      DATABASE_URL: postgresql://secureaura:secureaura_pass_2024@postgres:5432/timing_defense
      REDIS_URL: redis://:redis_secure_2024@redis:6379/1
      ENVIRONMENT: development
      LOG_LEVEL: info
      DETECTION_THRESHOLD: 0.75
      ANALYSIS_WINDOW: 300
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - secure-aura-network
    volumes:
      - ./services/monitor-service:/app
      - /app/node_modules
    command: node src/server.js

  # Dashboard Frontend (React)
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: secure-aura-dashboard
    environment:
      REACT_APP_AUTH_API_URL: http://localhost:8000
      REACT_APP_MONITOR_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - monitor-service
    networks:
      - secure-aura-network
    volumes:
      - ./services/dashboard:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  # API Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: secure-aura-gateway
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - monitor-service
      - dashboard
    networks:
      - secure-aura-network

volumes:
  postgres_data:
  redis_data:

networks:
  secure-aura-network:
    driver: bridge
